<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>調理助手アプリ</title>
    <style>
        /* ここはアプリの見た目を決める部分です */
        body { font-family: sans-serif; background-color: #f0f4f8; padding: 20px; color: #333; }
        h1 { text-align: center; color: #2c3e50; font-size: 24px; }
        .card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2 { font-size: 18px; color: #e67e22; border-bottom: 2px solid #e67e22; padding-bottom: 5px; }
        label { display: inline-block; margin: 5px 10px 5px 0; font-size: 16px; cursor: pointer; }
        input[type="checkbox"] { transform: scale(1.5); margin-right: 5px; }
        input[type="number"] { font-size: 20px; width: 60px; padding: 5px; text-align: center; }
        
        button {
            display: block; width: 100%; padding: 15px; 
            background-color: #e67e22; color: white; 
            font-size: 20px; font-weight: bold; border: none; 
            border-radius: 10px; cursor: pointer;
        }
        button:active { background-color: #d35400; }
        
        #resultArea { display: none; background-color: #fff3cd; border: 2px solid #ffeeba; }
        .recipe-title { font-weight: bold; font-size: 20px; margin-bottom: 10px; color: #d35400; }
        .point { font-weight: bold; color: #c0392b; }
    </style>
</head>
<body>

    <h1>🍳 グループホーム<br>調理助手アプリ</h1>

    <div class="card">
        <h2>① 食べる人数</h2>
        <div style="text-align: center;">
            <input type="number" id="peopleCount" value="8" min="1"> 人
        </div>
    </div>

    <div class="card">
        <h2>② 冷蔵庫にあるもの</h2>
        <p style="font-size:14px; color:#666;">タップしてチェックを入れてください</p>
        
        <h3>🥦 野菜・きのこ</h3>
        <div id="vegList"></div>

        <h3>🥩 肉・加工品</h3>
        <div id="meatList"></div>

        <h3>🥫 その他・乾物</h3>
        <div id="otherList"></div>
    </div>

    <button onclick="proposeMenu()">献立を提案する！</button>

    <div class="card" id="resultArea">
        <div id="resultContent"></div>
    </div>

    <script>
        // === ここはアプリの頭脳（データと計算）です ===

        // いただいたリストを登録しました
        const vegetables = ["玉葱", "人参", "しいたけ", "エリンギ", "えのき", "ほうれん草", "小松菜", "大根", "チンゲン菜", "キャベツ", "冷凍コーン", "レンコン", "白菜", "豆腐"];
        const meats = ["豚ミンチ", "豚コマ", "鶏ムネ", "ベーコン", "ウインナー", "ハム"];
        const others = ["乾燥ワカメ", "きざみ揚げ", "ツナ缶", "冷凍うどん", "チーズ", "春雨"];

        // 画面にリストを表示する仕組み
        function createCheckboxes(list, elementId) {
            const container = document.getElementById(elementId);
            list.forEach(item => {
                const label = document.createElement("label");
                label.innerHTML = `<input type="checkbox" value="${item}"> ${item}`;
                container.appendChild(label);
            });
        }
        createCheckboxes(vegetables, "vegList");
        createCheckboxes(meats, "meatList");
        createCheckboxes(others, "otherList");

        // ★★★ 提案ロジック（ここがあなたの知恵です） ★★★
        function proposeMenu() {
            const people = document.getElementById("peopleCount").value;
            
            // チェックされた食材を集める
            const checkedVeg = Array.from(document.querySelectorAll('#vegList input:checked')).map(cb => cb.value);
            const checkedMeat = Array.from(document.querySelectorAll('#meatList input:checked')).map(cb => cb.value);
            const checkedOther = Array.from(document.querySelectorAll('#otherList input:checked')).map(cb => cb.value);
            const allChecked = [...checkedVeg, ...checkedMeat, ...checkedOther];

            let htmlContent = "";

            if (allChecked.length === 0) {
                alert("食材が選ばれていません！冷蔵庫を見てチェックを入れてください。");
                return;
            }

            // --- 提案1：かさ増し炒め（肉と野菜がある時） ---
            if (checkedMeat.length > 0 && checkedVeg.length > 0) {
                htmlContent += `
                    <div class="recipe-title">提案1：失敗しない「ガッツリ炒め」</div>
                    <p>利用者が満足するボリュームおかずです。</p>
                    <ul>
                        <li><b>使う肉：</b>${checkedMeat.join("、")}（あるだけ全部）</li>
                        <li><b>野菜：</b>${checkedVeg.join("、")}</li>
                    </ul>
                    <hr>
                    <p class="point">👩‍🍳 味付けの黄金比（${people}人分）</p>
                    <p>この人数なら、難しい調合はやめましょう。</p>
                    <p>
                        1. 具材を全部炒める。<br>
                        2. <b>「焼肉のタレ」</b>を全体に回しかける（約${Math.round(people * 20)}ml目安）。<br>
                        3. 隠し味に<b>「オイスターソース」</b>を大さじ1〜2入れる。<br>
                        4. これだけでプロっぽいコクが出ます！
                    </p>
                    <br>
                `;
            }

            // --- 提案2：副菜（葉物やベーコンがある時） ---
            if (checkedVeg.some(v => v.includes("ほうれん草") || v.includes("小松菜") || v.includes("コーン")) || checkedMeat.includes("ベーコン")) {
                htmlContent += `
                    <div class="recipe-title">提案2：5分で作れる副菜</div>
                    <p>「あと一品」に迷ったらこれです。</p>
                    <p><b>バター醤油ソテー</b></p>
                    <p>
                        1. フライパンでベーコン、コーン、葉物を炒める。<br>
                        2. <b>「塩コショウ」</b>少々。<br>
                        3. 最後に<b>「無塩バター」</b>1かけと<b>「醤油」</b>ひと回し。<br>
                    </p>
                    <br>
                `;
            }

            // --- 提案3：汁物・煮物（うどん、揚げ、ワカメがある時） ---
            if (checkedOther.includes("冷凍うどん") || checkedOther.includes("きざみ揚げ") || checkedOther.includes("乾燥ワカメ")) {
                htmlContent += `
                    <div class="recipe-title">提案3：困った時の「具沢山スープ」</div>
                    <p>汁物とおかずを兼ねてしまいましょう。</p>
                    <p>
                        1. 鍋にお湯を沸かす。<br>
                        2. <b>「なごみつゆ（または麺つゆ）」</b>で吸い物より少し濃い目の味にする。<br>
                        3. きざみ揚げ、ワカメ、余った野菜を入れる。<br>
                        4. 足りなければ「冷凍うどん」を折って入れる。<br>
                    </p>
                `;
            }

            // 何も当てはまらない場合の汎用メッセージ
            if (htmlContent === "") {
                htmlContent = `
                    <div class="recipe-title">💡 提案</div>
                    <p>選ばれた食材：${allChecked.join("、")}</p>
                    <p>
                        この組み合わせなら、全部お鍋に入れて<b>「具沢山みそ汁」</b>にするか、
                        <b>「焼肉のタレ」</b>で炒めてしまいましょう。それが一番間違いありません！
                    </p>
                `;
            }

            // 結果を表示
            document.getElementById("resultContent").innerHTML = htmlContent;
            document.getElementById("resultArea").style.display = "block";
            
            // 結果のところまで画面をスクロール
            document.getElementById("resultArea").scrollIntoView({behavior: "smooth"});
        }
    </script>
</body>
</html>
